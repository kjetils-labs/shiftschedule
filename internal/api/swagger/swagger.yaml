basePath: /v1
definitions:
  CoverView:
    properties:
      covered_by:
        $ref: '#/definitions/PersonRef'
      ends_at:
        type: string
      id:
        type: integer
      is_me:
        type: boolean
      reason:
        type: string
      starts_at:
        type: string
    type: object
  ErrorResponse:
    properties:
      code:
        example: 403
        type: integer
      message:
        example: forbidden
        type: string
    type: object
  Overview:
    properties:
      day_shift:
        items:
          $ref: '#/definitions/PositionSchedule'
        type: array
      on_call:
        items:
          $ref: '#/definitions/PositionSchedule'
        type: array
    type: object
  PersonRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  Personnel:
    properties:
      email:
        type: string
      groups:
        items:
          type: string
        type: array
      id:
        type: integer
      is_admin:
        type: boolean
      name:
        type: string
    type: object
  PingResult:
    properties:
      message:
        example: pong
        type: string
    type: object
  Position:
    properties:
      id:
        type: integer
      kind:
        $ref: '#/definitions/ShiftKind'
      manager_id:
        type: integer
      name:
        type: string
      team_id:
        type: integer
      team_name:
        type: string
    type: object
  PositionSchedule:
    properties:
      current:
        $ref: '#/definitions/WeekView'
      my_next:
        $ref: '#/definitions/WeekView'
      my_next_cover:
        $ref: '#/definitions/UpcomingCover'
      next:
        $ref: '#/definitions/WeekView'
      position:
        $ref: '#/definitions/Position'
      previous:
        $ref: '#/definitions/WeekView'
    type: object
  Response-CoverView:
    properties:
      body:
        $ref: '#/definitions/CoverView'
      code:
        type: integer
      message:
        type: string
    type: object
  Response-array_Personnel:
    properties:
      body:
        items:
          $ref: '#/definitions/Personnel'
        type: array
      code:
        type: integer
      message:
        type: string
    type: object
  Response-array_Position:
    properties:
      body:
        items:
          $ref: '#/definitions/Position'
        type: array
      code:
        type: integer
      message:
        type: string
    type: object
  Response-array_github_com_shiftschedule_internal_service_PositionSchedule:
    properties:
      body:
        items:
          $ref: '#/definitions/PositionSchedule'
        type: array
      code:
        type: integer
      message:
        type: string
    type: object
  Response-github_com_shiftschedule_internal_domain_Personnel:
    properties:
      body:
        $ref: '#/definitions/Personnel'
      code:
        type: integer
      message:
        type: string
    type: object
  Response-github_com_shiftschedule_internal_service_Overview:
    properties:
      body:
        $ref: '#/definitions/Overview'
      code:
        type: integer
      message:
        type: string
    type: object
  Response-internal_api_PingResult:
    properties:
      body:
        $ref: '#/definitions/PingResult'
      code:
        type: integer
      message:
        type: string
    type: object
  Response-internal_api_RotationResult:
    properties:
      body:
        $ref: '#/definitions/RotationResult'
      code:
        type: integer
      message:
        type: string
    type: object
  RotationResult:
    properties:
      created:
        type: integer
    type: object
  ShiftKind:
    enum:
    - day_shift
    - on_call
    type: string
    x-enum-varnames:
    - KindDayShift
    - KindOnCall
  UpcomingCover:
    properties:
      cover:
        $ref: '#/definitions/CoverView'
      week_start:
        type: string
    type: object
  WeekView:
    properties:
      assignee:
        $ref: '#/definitions/PersonRef'
      covers:
        items:
          $ref: '#/definitions/CoverView'
        type: array
      ends_at:
        type: string
      holder:
        $ref: '#/definitions/PersonRef'
      is_me:
        type: boolean
      starts_at:
        type: string
      week_start:
        type: string
    type: object
  createCoverRequest:
    properties:
      covered_by:
        type: integer
      position_id:
        type: integer
      reason:
        maxLength: 500
        type: string
      scope:
        enum:
        - rest_of_day
        - whole_week
        type: string
      week_start:
        example: "2026-11-16"
        type: string
    required:
    - covered_by
    - position_id
    - scope
    type: object
  createPersonnelRequest:
    properties:
      email:
        example: nina@example.com
        type: string
      groups:
        example:
        - alpha
        items:
          type: string
        type: array
      is_admin:
        type: boolean
      name:
        example: Nina Berg
        maxLength: 200
        type: string
    required:
    - email
    - groups
    - name
    type: object
  generateRotationRequest:
    properties:
      year:
        example: 2027
        maximum: 2200
        minimum: 2000
        type: integer
    required:
    - year
    type: object
  setAssignmentRequest:
    properties:
      assignee_id:
        type: integer
      position_id:
        type: integer
      week_start:
        example: "2026-11-16"
        type: string
    required:
    - position_id
    - week_start
    type: object
  setRedDayRequest:
    properties:
      is_red_day:
        type: boolean
      name:
        example: Company day
        maxLength: 200
        type: string
    type: object
info:
  contact: {}
  description: 'Who has which shift. A week runs Monday 08:00 to Monday 08:00 (Europe/Oslo):
    day shifts are 08:00-15:30 and on-call 15:30-08:00 the day after.'
  title: Shift schedule API
  version: "1.0"
paths:
  /admin/personnel:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_Personnel'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Admins only
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: List personnel
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: People are matched to their login by email. Their groups decide
        which teams they are in.
      parameters:
      - description: The person
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/createPersonnelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Response-github_com_shiftschedule_internal_domain_Personnel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Admins only
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: Register a person
      tags:
      - admin
  /admin/red-days/{date}:
    delete:
      parameters:
      - description: Date (YYYY-MM-DD)
        example: "2026-12-24"
        in: path
        name: date
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Admins only
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: Remove a red day override
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Overrides the weekends and the computed Norwegian public holidays.
        Red days have no day shift left to cover.
      parameters:
      - description: Date (YYYY-MM-DD)
        example: "2026-12-24"
        in: path
        name: date
        required: true
        type: string
      - description: The override
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/setRedDayRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Admins only
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: Override whether a date is a red day
      tags:
      - admin
  /admin/rotations:
    post:
      consumes:
      - application/json
      description: Rotates each position through its team's members in alphabetical
        order, one week at a time. Weeks that already have an assignee are left alone.
      parameters:
      - description: The year
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/generateRotationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Number of assignments created
          schema:
            $ref: '#/definitions/Response-internal_api_RotationResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Admins only
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: Generate a year of rotations
      tags:
      - admin
  /assignments:
    put:
      consumes:
      - application/json
      description: A null `assignee_id` leaves the week unfilled. The assignee must
        be a member of the position's team. Admins and the team manager only.
      parameters:
      - description: The assignment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/setAssignmentRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: Set who holds a position for a week
      tags:
      - assignments
  /covers:
    post:
      consumes:
      - application/json
      description: Hand a position over to a team member for the rest of the day (only
        for the current week) or for the whole week. Allowed for the assignee, the
        team manager and admins. `week_start` (Monday, YYYY-MM-DD) is optional and
        defaults to the current week. Cover across teams is not allowed.
      parameters:
      - description: The cover
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/createCoverRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Response-CoverView'
        "400":
          description: Invalid request, or the coverer is not in the team
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Overlapping cover, nothing left of the shift today, or the
            week has passed
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: Cover a position
      tags:
      - covers
  /covers/{id}:
    delete:
      description: Allowed for the assignee, the person covering, the team manager
        and admins.
      parameters:
      - description: Cover id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: Remove a cover
      tags:
      - covers
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-github_com_shiftschedule_internal_domain_Personnel'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Signed in, but not registered as personnel
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Identity provider unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: The signed-in person
      tags:
      - me
  /me/schedule:
    get:
      description: Previous, current, next and my next week for every position of
        the teams I am a member of. Weeks run Monday 08:00 to Monday 08:00 (Europe/Oslo).
        `is_me` marks the weeks and covers I am part of. An empty list means I have
        no positions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_github_com_shiftschedule_internal_service_PositionSchedule'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: My schedules
      tags:
      - me
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-internal_api_PingResult'
      summary: Liveness check
      tags:
      - system
  /positions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-array_Position'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: List positions
      tags:
      - schedules
  /schedules/overview:
    get:
      description: Day shifts (08:00-15:30) and on-call shifts (15:30-08:00) with
        the previous, current and next person, plus my next shift where I take part.
        The other kind is left empty when `kind` is given.
      parameters:
      - description: Only this kind of shift
        enum:
        - day_shift
        - on_call
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response-github_com_shiftschedule_internal_service_Overview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      - DevUser: []
      summary: Overview of all shifts
      tags:
      - schedules
securityDefinitions:
  BearerAuth:
    description: 'AUTH_MODE=oidc: "Bearer <ID token from Dex>".'
    in: header
    name: Authorization
    type: apiKey
  DevUser:
    description: 'AUTH_MODE=dev only: the email of the person to act as.'
    in: header
    name: X-Dev-User
    type: apiKey
swagger: "2.0"

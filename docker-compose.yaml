services:
  postgres:
    image: postgres:17-alpine
    container_name: shiftschedule-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./hacks/data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: shiftschedule-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "${DEX_PORT:-5556}:5556"
    volumes:
      - ./hacks/dex/config.yaml:/etc/dex/config.yaml:ro
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: shiftschedule-pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
      - source: pgadmin_pgpass
        target: /pgpass
        uid: "5050"
        mode: 0400
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

# Built from .env so the credentials are not repeated. pgAdmin imports servers.json on first start of a fresh container.
configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "shiftschedule",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB}",
            "Username": "${POSTGRES_USER}",
            "SSLMode": "prefer",
            "PassFile": "/pgpass"
          }
        }
      }
  pgadmin_pgpass:
    content: postgres:5432:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}
